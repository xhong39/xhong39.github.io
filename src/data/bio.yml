paragraphs:
  - >
    Hi, I'm Xi Hong, a fourth-year Ph.D. student in Informaton Science at the University of Wisconsin-Madison, advised by
    <a href="https://chaoqunni.github.io">Prof. Chaoqun Ni</a> in the
    <a href="https://metasci.ischool.wisc.edu/people.html">MetaScience Research Lab</a>.
  - >
    My research lies at the intersection of computational social science,
    data science, and education and science policy studies.
    Using large-scale scholarly, administrative, and survey data with statistical
    modeling, machine learning, large language models, and qualitative methods,
    I aim to understand how higher education institutions can better develop and
    sustain scholars, and how institutions and scientific ecosystems can adapt
    to and shape technological and societal change.
    I currently focus
    on how AI is reshaping educational and scientific ecosystems and on
    developing agentic AI systems to support evidence-informed policymaking
    in these domains.
  - >
    I am exploring opportunities in both academia and industry. I’d love to
    chat about my recent work and potential career opportunities.
    <a href="mailto:xhong39@wisc.edu?subject=Career%20opportunities">✉️ Get in touch</a>.
